# Baseline configuration: CNN + MLP PPO (no LSTM)

experiment:
  name: "crafter_mlp_ppo"
  description: "CNN + MLP + PPO baseline on Crafter"
  model_type: "ActorCritic"
  seed: 42

environment:
  reward: true
  max_episode_steps: 10000

model:
  in_channels: 3
  cnn_out_features: 512
  num_actions: 17

training:
  total_timesteps: 500000
  num_envs: 4
  rollout_steps: 128
  ppo_epochs: 4
  batch_size: 128
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  target_kl: null

device:
  prefer_mps: true

checkpointing:
  checkpoint_dir: "checkpoints"
  checkpoint_interval: 25000
  max_checkpoints: 10

recording:
  enabled: true
  storage_dir: "recordings"
  frame_interval: 4
  compression: true
  max_storage_gb: 2.0

logging:
  log_dir: "logs"
  tensorboard_dir: "tensorboard_logs"
  log_interval: 1
  eval_interval: 50000
  eval_episodes: 5

evaluation:
  num_episodes: 10
  seed: 1000

